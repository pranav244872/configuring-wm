#? Config file for btop v1.4.7
# Only the theme selection is pinned here; btop fills in the rest of its
# defaults on first run and keeps these values when it rewrites the file.
# The theme itself is generated by matugen: ~/.config/btop/themes/matugen.theme
# (regenerated on every wallpaper change; btop picks it up at next start).
color_theme = "matugen"
theme_background = True
