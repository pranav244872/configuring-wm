# mpv — bare config
# UI: uosc (right-click anywhere = full menu; speed/volume bars on the timeline)

# ==== VIDEO ====
vo=gpu-next
gpu-api=opengl
hwdec=auto-safe
profile=high-quality

# ==== SUBTITLES / OSD ====
# Fonts live in ~/.config/mpv/fonts (mpv loads that dir automatically)
sub-font='Netflix Sans'
sub-font-size=40
osd-font='Netflix Sans'
osd-font-size=20

# Audio/subtitle language preference (anime first, English fallback)
alang=ja,jp,jpn,en,eng
slang=en,eng

# ==== SCREENSHOTS ====
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots

# ==== MISC ====
keep-open=yes