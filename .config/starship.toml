add_newline = false

format = """
$cmd_duration $directory$git_branch
  $character"""

palette = 'custom'

[palettes.custom]
color1 = '#b4c5fb'
color2 = '#1d2e5b'
color3 = '#e4e2e6'
color4 = '#b4c5fb'
color5 = '#1d2e5b'
color6 = '#031945'
color7 = '#b4c5fb'
color8 = '#b4c5fb'
color9 = '#e2b8ee'

[fill]
symbol = '-'
style = 'fg:color3'

[character]
success_symbol = "[ ](bold fg:color3)"
error_symbol = "[ ](bold fg:color9)"

[package]
disabled = true

[git_branch]
style = "bg:color4"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:color4)[$symbol $branch(:$remote_branch)](fg:color6 bg:color4)[](bold fg:color4)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:color4 bold fg:color6)[](bold fg:color4)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:color4 fg:color6"
style_root = "red bold"
format = "[](bold fg:color4)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:color7 fg:color6"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:color7)[󰉋 → $path]($style)[](bold fg:color7)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:color4)[󰪢 $duration](bold bg:color4 fg:color6)[](bold fg:color4)'
